<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · Task Manager</title>
<!-- Same early theme-apply as dashboard.html — keeps the sign-in page in
     whatever Light/Dark/System choice was last made from the dashboard. -->
<script>
  (function () {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <img src="assets/logo.png" alt="Cranes Varsity" class="auth-logo">
    <h1>Task Manager</h1>
    <p class="sub">Sign in to continue</p>

    <div id="errorBox" class="error-msg" style="display:none;"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="you@company.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
  redirectIfAuthed();

  document.getElementById('togglePassword').addEventListener('click', () => {
    const pwd = document.getElementById('password');
    const btn = document.getElementById('togglePassword');
    const showing = pwd.type === 'text';
    pwd.type = showing ? 'password' : 'text';
    btn.textContent = showing ? '👁' : '🙈';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    const result = await login(email, password);
    submitBtn.disabled = false;
    const box = document.getElementById('errorBox');
    if (!result.ok) {
      box.textContent = result.error;
      box.style.display = 'block';
      return;
    }
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
